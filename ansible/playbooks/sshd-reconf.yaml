---
- name: Reconfigure SSHD
  hosts: all
  become: true
  remote_user: "{{ hostvars[inventory_hostname].user }}"
  become_user: root
  vars:
    ansible_host_key_checking: false

  tasks:
    - name: Enforce limit
      ansible.builtin.fail:
        msg: "You must use -l or --limit. To run on all hosts, use -l 'all'."
      when: ansible_limit is not defined

    - name: Update sshd config - Listen on IPv4 all
      ansible.builtin.lineinfile:
        path: '/etc/ssh/sshd_config'
        regexp: '^\#ListenAddress 0\.0\.0\.0'
        line: 'ListenAddress 0.0.0.0'
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart sshd

    - name: Update sshd config - Listen on IPv6 all
      ansible.builtin.lineinfile:
        path: '/etc/ssh/sshd_config'
        regexp: '^\#ListenAddress \:\:'
        line: 'ListenAddress ::'
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart sshd

    - name: Update sshd config - disable empty passwords
      ansible.builtin.lineinfile:
        path: '/etc/ssh/sshd_config'
        regexp: '^\#PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart sshd

    - name: Disable password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart sshd

    - name: Disable keyboard-interactive authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?KbdInteractiveAuthentication"
        line: "KbdInteractiveAuthentication no"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart sshd

    - name: Update sshd config - disable root login
      ansible.builtin.lineinfile:
        path: '/etc/ssh/sshd_config'
        regexp: '^\#PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart sshd

    - name: Update sshd config - disable X11 fowarding
      ansible.builtin.lineinfile:
        path: '/etc/ssh/sshd_config'
        regexp: '^X11Forwarding yes'
        line: 'X11Forwarding no'
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Restart sshd

    - name: Check if file exists in playbook directory
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/files/ssh-pubkeys.pub"
      register: pubkey_file

    - name: Update SSH public keys
      ansible.posix.authorized_key:
        user: "{{ hostvars[inventory_hostname].user }}"
        state: present
        key: "{{ lookup('file', 'files/ssh-pubkeys.pub') }}"
        exclusive: true
        manage_dir: true
      when: pubkey_file.stat.exists

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted