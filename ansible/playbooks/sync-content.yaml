- name: Sync content to document server
  hosts: all
  become: true
  remote_user: "{{ hostvars[inventory_hostname].user }}"
  become_user: root
  vars_files:
    - vars/document-server.yaml

  tasks:
    - name: Sync local directory content directory to remote
      ansible.posix.synchronize:
        src: "{{ local_content_sync_path }}/"
        dest: /home/{{ hostvars[inventory_hostname].user }}/document-server/nginx-root/{{ content_path }}/
        checksum: true
        copy_links: true
        times: true
        delete: true
        recursive: true
      notify: Change content permissions
 
  handlers:
    - name: Change content permissions
      ansible.builtin.file:
        path: /home/{{ hostvars[inventory_hostname].user }}/document-server/nginx-root/{{ content_path }}/
        state: directory
        owner: "{{ hostvars[inventory_hostname].user }}"
        mode: u=rwX,g=rwX,o=rX
        recurse: true
      notify: Docker compose restart

    - name: Docker compose restart
      ansible.builtin.command:
        cmd: "docker compose --project-directory /home/{{ hostvars[inventory_hostname].user }}/document-server/ restart"
