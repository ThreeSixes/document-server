# AP mode handler configuration
ap_mode_handler_delay_sec: 30

# Web page configuration
landing_page_title: Document Server / Servidor de documentos
content_path: content
kiwix_path: wiki
active_wiki_path: wikis-active

# External listener configuration
external_web_port: 80
listen_host: 0.0.0.0

# Kiwix wiki config - release tags here: https://github.com/kiwix/kiwix-tools/tags
kiwix_tag: 3.8.2
kiwix_image: ghcr.io/kiwix/kiwix-serve
kiwix_port: 8080
kiwix_service: kiwix-serve

# NGINX web server config - release tags here: https://hub.docker.com/_/nginx
nginx_tag: 1.34.1-alpine
nginx_image: nginx
nginx_port: 80
nginx_service: nginx
