---
- name: Bootstrap Raspberry Pi Server
  hosts: all
  become: true
  remote_user: "{{ hostvars[inventory_hostname].user }}"
  become_user: root
  vars:
    ansible_host_key_checking: false

  tasks:
    - name: Enforce limit
      ansible.builtin.fail:
        msg: "You must use -l or --limit. To run on all hosts, use -l 'all'."
      when: ansible_limit is not defined

    - name: Cloud-init - preserve_hostname cloud.cfg
      ansible.builtin.lineinfile:
        path: "/etc/cloud/cloud.cfg"
        regexp: "^preserve_hostname: false$"
        line: 'preserve_hostname: true'

    - name: Cloud-init - settings block in cloud.cfg
      ansible.builtin.blockinfile:
        path: /etc/cloud/cloud.cfg
        block: |
          manage_etc_hosts: true
        marker: "# {mark} ANSIBLE MANAGED BLOCK"

    - name: Cloud-init - user-data settings
      ansible.builtin.blockinfile:
        path: /boot/firmware/user-data
        block: |
          preserve_hostname: true
        marker: "# {mark} ANSIBLE MANAGED BLOCK"

    - name: Update apt repo
      ansible.builtin.apt:
        update_cache: true
        force_apt_get: false
        cache_valid_time: 3600

    - name: Upgrade all packages on server
      ansible.builtin.apt:
        upgrade: dist
        force_apt_get: true

    - name: Check for required reboot
      register: reboot_required_file
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: false
      changed_when: reboot_required_file.stat.exists
      notify: Reboot

    - name: Install aptitude
      ansible.builtin.apt:
        name: aptitude
        state: present
        update_cache: true
        force_apt_get: true
        cache_valid_time: 3600

    - name: Install baseline applications
      ansible.builtin.apt:
        name:
          - apt-listchanges
          - apt-transport-https
          - ca-certificates
          - curl
          - dnsutils
          - htop
          - unattended-upgrades
          - vim
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Update CA certificates...
      ansible.builtin.command:
        cmd: update-ca-certificates
        creates: /etc/ssl/certs/

    - name: Set Vim as the default editor for all users
      ansible.builtin.command:
        cmd: update-alternatives --set editor /usr/bin/vim.basic
        creates: /etc/alternatives/editor
      become: true

    - name: Set the hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
      notify: Reboot

    - name: Update sshd config - Listen on IPv4 all
      ansible.builtin.lineinfile:
        path: '/etc/ssh/sshd_config'
        regexp: '^\#ListenAddress 0\.0\.0\.0$'
        line: 'ListenAddress 0.0.0.0'
      notify: Restart sshd

    - name: Update sshd config - Listen on IPv6 all
      ansible.builtin.lineinfile:
        path: '/etc/ssh/sshd_config'
        regexp: '^\#ListenAddress \:\:$'
        line: 'ListenAddress ::'
      notify: Restart sshd

    - name: Check if file exists in playbook directory
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/files/ssh-pubkeys.pub"
      register: pubkey_file

    - name: Update SSH public keys
      ansible.posix.authorized_key:
        user: "{{ hostvars[inventory_hostname].user }}"
        state: present
        key: "{{ lookup('file', 'files/ssh-pubkeys.pub') }}"
        exclusive: true
        manage_dir: true
      when: pubkey_file.stat.exists

  handlers:
    - name: Reboot
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible."
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      throttle: 1

    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
